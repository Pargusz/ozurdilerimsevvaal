<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şevval, Özür Dilerim</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root{ --bg1:#0e1116; --light:#e6ebf2; --blue:#1c69d4; --blue2:#4fa3ff; --gray:#8a94a3; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at top,#1d2633 0%,var(--bg1) 60%) fixed,var(--bg1);
    color:var(--light);overflow:hidden;min-height:100vh;display:flex;flex-direction:column;
  }
  .stars{position:fixed;inset:0;pointer-events:none}
  .stars span{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--blue2);opacity:0;animation:tw 4s infinite}
  @keyframes tw{50%{opacity:.8}}

  main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}

  .bouquet-wrap{margin-bottom:24px;animation:fade 1.2s ease-out both}
  .bouquet{width:clamp(150px,40vw,220px);transform-origin:50% 95%;
     animation:sway 4s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(79,163,255,.35))}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

  h1{font-family:'Playfair Display',serif;font-size:clamp(3.2rem,14vw,8rem);line-height:1;
     background:linear-gradient(120deg,var(--light) 20%,var(--blue2) 50%,var(--light) 80%);
     background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
     animation:shine 5s linear infinite, fade 1.2s .2s ease-out both}
  h2{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(2rem,8vw,4.2rem);color:var(--blue2);margin-top:10px;
     text-shadow:0 0 30px rgba(79,163,255,.35);animation:fade 1.2s .5s ease-out both}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1.1rem,4.5vw,1.8rem);
     color:var(--gray);margin-top:14px;max-width:100%;overflow-wrap:anywhere;letter-spacing:.02em;
     animation:fade 1.2s .7s ease-out both}
  .line{width:120px;height:3px;margin-top:28px;border-radius:3px;
     background:linear-gradient(90deg,var(--gray),var(--blue),var(--blue2));animation:fade 1.2s .8s ease-out both}
  @keyframes shine{to{background-position:200% center}}
  @keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<main>
  <div class="bouquet-wrap">
    <svg class="bouquet" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <g id="flower">
          <ellipse rx="9" ry="17" cy="-13"/>
          <ellipse rx="9" ry="17" cy="-13" transform="rotate(60)"/>
          <ellipse rx="9" ry="17" cy="-13" transform="rotate(120)"/>
          <ellipse rx="9" ry="17" cy="-13" transform="rotate(180)"/>
          <ellipse rx="9" ry="17" cy="-13" transform="rotate(240)"/>
          <ellipse rx="9" ry="17" cy="-13" transform="rotate(300)"/>
          <circle r="7" fill="#f2f5f9"/>
          <circle r="3.5" fill="#8a94a3"/>
        </g>
        <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c3cad4"/><stop offset=".55" stop-color="#8a94a3"/><stop offset="1" stop-color="#4a5361"/>
        </linearGradient>
      </defs>

      <!-- yapraklar -->
      <g fill="#5f7f73">
        <ellipse cx="44" cy="92" rx="8" ry="24" transform="rotate(-50 44 92)"/>
        <ellipse cx="156" cy="92" rx="8" ry="24" transform="rotate(50 156 92)"/>
        <ellipse cx="62" cy="40" rx="7" ry="20" transform="rotate(-30 62 40)"/>
        <ellipse cx="140" cy="38" rx="7" ry="20" transform="rotate(30 140 38)"/>
      </g>

      <!-- çiçekler -->
      <use href="#flower" x="80" y="48" fill="#e6ebf2" transform="scale(1)"/>
      <use href="#flower" x="122" y="46" fill="#6bb6ff"/>
      <use href="#flower" x="62" y="84" fill="#1c69d4"/>
      <use href="#flower" x="138" y="84" fill="#cfe6ff"/>
      <use href="#flower" x="100" y="96" fill="#8fb8ea"/>
      <g transform="translate(100 66) scale(1.25)" fill="#4fa3ff"><use href="#flower"/></g>

      <!-- minik beyaz çiçekler -->
      <g fill="#f2f5f9">
        <circle cx="46" cy="62" r="3"/><circle cx="52" cy="56" r="2.5"/><circle cx="40" cy="70" r="2"/>
        <circle cx="156" cy="62" r="3"/><circle cx="150" cy="56" r="2.5"/><circle cx="162" cy="70" r="2"/>
        <circle cx="100" cy="24" r="3"/><circle cx="94" cy="20" r="2"/><circle cx="106" cy="19" r="2.5"/>
      </g>

      <!-- ambalaj kağıdı -->
      <path d="M46 108 L154 108 L112 206 L88 206Z" fill="url(#paper)"/>
      <path d="M46 108 L100 120 L154 108 L136 112 L100 126 L64 112Z" fill="#e6ebf2" opacity=".35"/>
      <path d="M100 126 L100 206" stroke="#3a4250" stroke-opacity=".4"/>

      <!-- kurdele -->
      <rect x="78" y="158" width="44" height="10" rx="2" fill="#1c69d4"/>
      <path d="M100 163 C84 146 70 152 76 166 C80 174 92 168 100 163Z" fill="#4fa3ff"/>
      <path d="M100 163 C116 146 130 152 124 166 C120 174 108 168 100 163Z" fill="#4fa3ff"/>
      <path d="M98 166 L88 192 L94 188 L98 196Z M102 166 L112 192 L106 188 L102 196Z" fill="#1c69d4"/>
      <circle cx="100" cy="163" r="5" fill="#0b2c5c"/>
    </svg>
  </div>
  <h1>Şevval,</h1>
  <h2>özür dilerim.</h2>
  <p class="sub">dünyanın en tatlı patronuuuuunaaaaaaaaaa</p>
  <div class="line"></div>
</main>

<script>
  const s = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('span');
    d.style.left = Math.random()*100 + '%';
    d.style.top = Math.random()*100 + '%';
    d.style.animationDelay = Math.random()*4 + 's';
    s.appendChild(d);
  }
</script>
</body>
</html>
